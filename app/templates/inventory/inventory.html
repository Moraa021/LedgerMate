{% extends "base.html" %}

{% block title %}Inventory{% endblock %}

{% block content %}
<div class="page-header mb-2">
    <h1 data-en="Inventory" data-sw="Bidhaa Dukani">Inventory</h1>
</div>

<div class="summary-cards">
    <div class="summary-card net">
        <h3 data-en="Total Stock Value" data-sw="Thamani ya Bidhaa">Total Stock Value</h3>
        <div class="amount" id="totalStockValue">KES 0</div>
    </div>
</div>

<div id="lowStockBanner" class="alert alert-warning hidden" style="position: static; margin-bottom: 20px;">
    <i class="fas fa-exclamation-triangle"></i> <span id="lowStockText"></span>
</div>

<button class="btn btn-primary btn-block mb-2" onclick="openAddItemModal()">
    <i class="fas fa-plus"></i> <span data-en="Add Item" data-sw="Ongeza Bidhaa">Add Item</span>
</button>

<div id="itemsList"></div>

<!-- Add Item Modal -->
<div class="modal" id="addItemModal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 data-en="Add Inventory Item" data-sw="Ongeza Bidhaa">Add Inventory Item</h3>
            <button class="modal-close" onclick="closeModal('addItemModal')">&times;</button>
        </div>
        <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="itemName" class="form-control" placeholder="e.g. Sugar 2kg">
        </div>
        <div class="form-group">
            <label>SKU (optional)</label>
            <input type="text" id="itemSku" class="form-control" placeholder="e.g. SUG-002">
        </div>
        <div class="form-group">
            <label>Category (optional)</label>
            <input type="text" id="itemCategory" class="form-control" placeholder="e.g. Groceries">
        </div>
        <div class="form-group">
            <label>Quantity on Hand</label>
            <input type="number" id="itemQty" class="form-control" value="0" step="0.01">
        </div>
        <div class="form-group">
            <label>Unit Cost (KES)</label>
            <input type="number" id="itemCost" class="form-control" value="0" step="0.01">
        </div>
        <div class="form-group">
            <label>Selling Price (KES)</label>
            <input type="number" id="itemPrice" class="form-control" value="0" step="0.01">
        </div>
        <div class="form-group">
            <label>Reorder Level</label>
            <input type="number" id="itemReorder" class="form-control" value="5" step="0.01">
        </div>
        <button class="btn btn-primary btn-block" onclick="submitAddItem()">Save Item</button>
    </div>
</div>

<!-- Movement Modal -->
<div class="modal" id="movementModal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="movementItemName">Update Stock</h3>
            <button class="modal-close" onclick="closeModal('movementModal')">&times;</button>
        </div>
        <input type="hidden" id="movementItemId">
        <div class="form-group">
            <label>Action</label>
            <select id="movementType" class="form-control">
                <option value="restock">Restock (add stock)</option>
                <option value="sale">Sale (remove stock)</option>
                <option value="adjustment">Adjustment (set exact quantity)</option>
            </select>
        </div>
        <div class="form-group">
            <label id="movementQtyLabel">Quantity</label>
            <input type="number" id="movementQty" class="form-control" step="0.01" min="0">
        </div>
        <div class="form-group" id="movementCostGroup">
            <label>New Unit Cost (optional, for restocks)</label>
            <input type="number" id="movementCost" class="form-control" step="0.01">
        </div>
        <button class="btn btn-primary btn-block" onclick="submitMovement()">Save</button>
    </div>
</div>

<style>
    .page-header h1 { font-weight: 700; }
    .inventory-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
    .inventory-item:last-child { border-bottom: none; }
    .stock-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
    .stock-badge.low { background: rgba(231,76,60,0.15); color: var(--danger-color); }
    .stock-badge.ok { background: rgba(46,204,113,0.15); color: var(--primary-color); }
</style>
{% endblock %}

{% block extra_js %}
<script>
let items = [];

document.addEventListener('DOMContentLoaded', loadItems);

function loadItems() {
    fetch('/inventory/api/list').then(r => r.json()).then(data => {
        if (!data.success) return;
        items = data.items;
        document.getElementById('totalStockValue').textContent = `KES ${data.total_stock_value.toLocaleString()}`;

        const banner = document.getElementById('lowStockBanner');
        if (data.low_stock_count > 0) {
            banner.classList.remove('hidden');
            document.getElementById('lowStockText').textContent = `${data.low_stock_count} item(s) are low on stock and need reordering.`;
        } else {
            banner.classList.add('hidden');
        }

        renderItems();
    });
}

function renderItems() {
    const container = document.getElementById('itemsList');
    if (items.length === 0) {
        container.innerHTML = `<div class="card text-center"><i class="fas fa-boxes" style="font-size:40px;color:#ccc;"></i><p>No inventory items yet.</p></div>`;
        return;
    }
    let html = '<div class="card" style="padding: 0;">';
    items.forEach(item => {
        html += `
            <div class="inventory-item">
                <div>
                    <div style="font-weight:600;">${item.name} ${item.sku ? '<span style="color:#999;font-size:12px;">('+item.sku+')</span>' : ''}</div>
                    <div style="font-size:13px;color:#888;">${item.category || 'Uncategorized'} &middot; KES ${item.unit_price.toLocaleString()} each</div>
                </div>
                <div style="text-align:right;">
                    <div class="stock-badge ${item.is_low_stock ? 'low' : 'ok'}">${item.quantity_on_hand} in stock</div>
                    <div style="margin-top:6px;">
                        <button class="btn btn-primary" style="padding:6px 12px;font-size:12px;" onclick="openMovementModal('${item.id}','${item.name.replace(/'/g,"")}')">Update</button>
                    </div>
                </div>
            </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
}

function openAddItemModal() { document.getElementById('addItemModal').style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function submitAddItem() {
    const payload = {
        name: document.getElementById('itemName').value,
        sku: document.getElementById('itemSku').value,
        category: document.getElementById('itemCategory').value,
        quantity_on_hand: document.getElementById('itemQty').value,
        unit_cost: document.getElementById('itemCost').value,
        unit_price: document.getElementById('itemPrice').value,
        reorder_level: document.getElementById('itemReorder').value
    };
    fetch('/inventory/api/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    }).then(r => r.json()).then(data => {
        if (data.success) { closeModal('addItemModal'); loadItems(); }
        else alert(data.error || 'Could not add item');
    });
}

function openMovementModal(id, name) {
    document.getElementById('movementItemId').value = id;
    document.getElementById('movementItemName').textContent = `Update: ${name}`;
    document.getElementById('movementModal').style.display = 'flex';
}

function submitMovement() {
    const id = document.getElementById('movementItemId').value;
    const payload = {
        movement_type: document.getElementById('movementType').value,
        quantity: document.getElementById('movementQty').value,
        unit_cost: document.getElementById('movementCost').value
    };
    fetch(`/inventory/api/${id}/movement`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    }).then(r => r.json()).then(data => {
        if (data.success) { closeModal('movementModal'); loadItems(); }
        else alert(data.error || 'Could not update stock');
    });
}
</script>
{% endblock %}
